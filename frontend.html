<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Company Qualifier</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.9/babel.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;700&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg: #0a0a0a; --bg1: #0d0d0d; --bg2: #111111; --bg3: #1a1a1a;
    --border: #222222; --dim: #444444; --text: #888888; --bright: #cccccc;
    --accent: #00ff9f; --blue: #00aaff; --orange: #ff6600;
    --purple: #aa44ff; --pink: #ff4488; --warn: #ffaa00; --err: #ff4444;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    background:var(--bg); color:var(--text);
    font-family:'JetBrains Mono','Cascadia Code','Fira Code',monospace;
    font-size:12.5px; line-height:1.5; height:100vh; overflow:hidden;
  }
  #root { height:100vh; display:flex; flex-direction:column; }

  /* ── Header ── */
  .hdr { background:var(--bg2); border-bottom:1px solid var(--border); padding:6px 16px; display:flex; align-items:center; justify-content:space-between; flex-shrink:0; }
  .hdr-title { color:var(--accent); font-weight:700; font-size:13px; letter-spacing:1px; }
  .hdr-right { display:flex; align-items:center; gap:16px; }
  .hdr-stat { color:var(--dim); font-size:11px; }
  .hdr-stat .on { color:var(--accent); } .hdr-stat .off { color:var(--warn); }

  /* ── Query Bar ── */
  .qbar { background:var(--bg2); border-bottom:1px solid var(--border); padding:8px 16px; display:flex; align-items:center; gap:8px; flex-shrink:0; }
  .qbar-prompt { color:var(--accent); font-weight:700; }
  .qbar-input { flex:1; background:var(--bg); border:1px solid var(--border); border-radius:3px; padding:7px 10px; color:var(--accent); font-family:inherit; font-size:12.5px; outline:none; }
  .qbar-input:focus { border-color:var(--accent); }
  .qbar-input::placeholder { color:var(--dim); }
  .qbar-btn { background:var(--accent); color:var(--bg); border:none; padding:7px 16px; border-radius:3px; font-family:inherit; font-weight:700; font-size:11px; cursor:pointer; letter-spacing:1px; }
  .qbar-btn:hover { opacity:.85; } .qbar-btn:disabled { opacity:.35; cursor:not-allowed; }
  .qbar-clear { background:none; border:1px solid var(--border); color:var(--dim); padding:7px 12px; border-radius:3px; font-family:inherit; font-size:11px; cursor:pointer; letter-spacing:1px; }
  .qbar-clear:hover { border-color:var(--dim); color:var(--text); }

  /* ── Main Layout ── */
  .main { flex:1; display:grid; grid-template-columns:1fr 1fr; overflow:hidden; }
  .panel { display:flex; flex-direction:column; overflow:hidden; }
  .panel + .panel { border-left:1px solid var(--border); }
  .panel-hdr { background:var(--bg2); padding:5px 12px; border-bottom:1px solid var(--border); color:var(--dim); font-weight:500; font-size:10px; letter-spacing:2px; text-transform:uppercase; flex-shrink:0; display:flex; justify-content:space-between; align-items:center; }
  .panel-body { flex:1; overflow-y:auto; padding:0; background:var(--bg1); }
  .panel-body::-webkit-scrollbar { width:5px; }
  .panel-body::-webkit-scrollbar-track { background:var(--bg1); }
  .panel-body::-webkit-scrollbar-thumb { background:var(--border); border-radius:3px; }

  /* ── Terminal Log ── */
  .term { padding:8px 10px; }
  .t { padding:0; white-space:pre-wrap; word-break:break-word; font-size:12px; line-height:1.55; }
  .t-sep { color:#1a1a1a; }
  .t-hdr { color:var(--accent); font-weight:700; }
  .t-dim { color:var(--dim); }
  .t-info { color:var(--text); }
  .t-val { color:var(--bright); }
  .t-s0 { color:var(--blue); font-weight:700; }
  .t-s1 { color:var(--orange); font-weight:700; }
  .t-s2 { color:var(--purple); font-weight:700; }
  .t-s3 { color:var(--pink); font-weight:700; }
  .t-warn { color:var(--warn); }
  .t-err { color:var(--err); font-weight:700; }
  .t-ok { color:var(--accent); font-weight:700; }

  /* Compiled query box */
  .cq { margin:6px 0; border:1px solid var(--border); background:var(--bg); border-radius:3px; }
  .cq-top { background:var(--bg3); padding:4px 10px; border-bottom:1px solid var(--border); color:var(--bright); font-weight:700; font-size:11px; letter-spacing:1px; }
  .cq-row { padding:1px 10px; font-size:11.5px; }
  .cq-section { padding:3px 10px; color:var(--dim); font-size:10px; letter-spacing:1px; text-transform:uppercase; border-top:1px solid #181818; margin-top:2px; }
  .cq-filter { color:var(--orange); }
  .cq-kw { color:var(--purple); }
  .cq-tree { color:var(--blue); }
  .cq-none { color:var(--dim); font-style:italic; }

  /* ── Results table ── */
  .rtbl { width:100%; border-collapse:collapse; }
  .rtbl th { text-align:left; padding:5px 8px; color:var(--accent); font-weight:500; font-size:10px; letter-spacing:1px; text-transform:uppercase; border-bottom:1px solid var(--border); position:sticky; top:0; background:var(--bg1); z-index:1; }
  .rtbl td { padding:5px 8px; border-bottom:1px solid #141414; vertical-align:top; }
  .rtbl tr { cursor:pointer; transition:background .12s; }
  .rtbl tr:hover { background:#0f1f0f; }
  .sc-h { color:var(--accent); font-weight:700; } .sc-m { color:var(--warn); } .sc-l { color:var(--dim); }
  .cname { color:var(--bright); font-weight:500; }
  .stag { display:inline-block; padding:1px 5px; border-radius:2px; font-size:10px; }
  .stag-hard_filter { background:#1a1500; color:var(--orange); }
  .stag-soft_score { background:#150025; color:var(--purple); }
  .stag-llm_qualified { background:#1a0020; color:var(--pink); }
  .loc { color:var(--dim); font-size:11.5px; }

  /* ── Detail Modal ── */
  .moverlay { position:fixed; inset:0; background:rgba(0,0,0,.75); display:flex; align-items:center; justify-content:center; z-index:100; animation:fi .12s ease; }
  @keyframes fi { from{opacity:0} to{opacity:1} }
  .modal { background:var(--bg2); border:1px solid var(--accent); border-radius:5px; width:660px; max-height:85vh; overflow-y:auto; padding:18px 22px; box-shadow:0 0 40px rgba(0,255,159,.07); }
  .modal::-webkit-scrollbar { width:5px; } .modal::-webkit-scrollbar-track { background:var(--bg2); } .modal::-webkit-scrollbar-thumb { background:var(--border); border-radius:3px; }
  .m-title { color:var(--accent); font-weight:700; font-size:15px; margin-bottom:14px; padding-bottom:6px; border-bottom:1px solid var(--border); }
  .m-row { display:flex; padding:2px 0; } .m-lbl { color:var(--dim); width:100px; flex-shrink:0; text-align:right; padding-right:10px; } .m-val { color:var(--bright); }
  .m-sec { color:var(--dim); font-size:10px; letter-spacing:1px; text-transform:uppercase; margin-top:12px; margin-bottom:4px; padding-top:6px; border-top:1px solid #1a1a1a; }
  .m-desc { color:var(--text); line-height:1.6; }
  .m-scroll { max-height:140px; overflow-y:auto; padding-right:4px; }
  .m-scroll::-webkit-scrollbar { width:3px; } .m-scroll::-webkit-scrollbar-track { background:transparent; } .m-scroll::-webkit-scrollbar-thumb { background:var(--border); border-radius:2px; }
  .m-tag { display:inline-block; background:var(--bg); color:var(--text); padding:1px 7px; border-radius:2px; margin:2px 3px 2px 0; font-size:10.5px; }
  .m-tags-scroll { max-height:70px; overflow-y:auto; padding-right:4px; }
  .m-tags-scroll::-webkit-scrollbar { width:3px; } .m-tags-scroll::-webkit-scrollbar-track { background:transparent; } .m-tags-scroll::-webkit-scrollbar-thumb { background:var(--border); border-radius:2px; }
  .m-close { color:var(--dim); font-size:10px; margin-top:14px; text-align:center; }
  .m-close kbd { background:var(--bg); padding:1px 5px; border-radius:2px; border:1px solid var(--border); }
  .m-llm-card { margin-top:12px; padding:10px 14px; border-radius:4px; border-left:3px solid var(--pink); background:rgba(170,50,100,.08); }
  .m-llm-title { color:var(--pink); font-size:10px; letter-spacing:1px; text-transform:uppercase; margin-bottom:6px; display:flex; align-items:center; gap:6px; }
  .m-llm-title::before { content:'◆'; font-size:7px; }
  .m-llm-body { color:#cc88cc; line-height:1.6; }
  .m-stage-badge { display:inline-block; padding:2px 8px; border-radius:3px; font-size:10px; font-weight:600; letter-spacing:0.5px; }
  .m-stage-badge.hard_filter { background:#0a1a10; color:var(--accent); }
  .m-stage-badge.soft_score { background:#150025; color:var(--purple); }
  .m-stage-badge.llm_qualified { background:#1a0020; color:var(--pink); border:1px solid rgba(170,50,100,.3); }
  .m-stage-badge.soft_score_fallback { background:#1a1500; color:var(--warn); }

  /* ── Warning Banner ── */
  .banner { background:#1a1200; border-bottom:2px solid var(--warn); padding:12px 20px; flex-shrink:0; display:flex; align-items:center; justify-content:space-between; gap:16px; }
  .banner-body { flex:1; }
  .banner-title { color:var(--warn); font-weight:700; font-size:12px; margin-bottom:4px; }
  .banner-text { color:var(--dim); font-size:11px; line-height:1.6; }
  .banner-text code { background:var(--bg); padding:1px 5px; border-radius:2px; color:var(--bright); }
  .banner-actions { display:flex; gap:8px; flex-shrink:0; }
  .banner-btn { padding:6px 14px; border-radius:3px; font-family:inherit; font-weight:700; font-size:10px; cursor:pointer; letter-spacing:1px; border:none; }
  .banner-btn-demo { background:var(--accent); color:var(--bg); }
  .banner-btn-demo:hover { opacity:.85; }
  .banner-btn-dismiss { background:none; border:1px solid var(--border); color:var(--dim); }
  .banner-btn-dismiss:hover { border-color:var(--dim); color:var(--text); }

  .spinner { display:inline-block; width:11px; height:11px; border:2px solid var(--border); border-top-color:var(--accent); border-radius:50%; animation:sp .5s linear infinite; margin-right:5px; vertical-align:middle; }
  @keyframes sp { to{transform:rotate(360deg)} }
  .empty { display:flex; align-items:center; justify-content:center; height:100%; color:var(--dim); font-size:11.5px; text-align:center; padding:20px; line-height:2; }
  .footer { background:var(--bg2); border-top:1px solid var(--border); padding:3px 16px; color:var(--dim); font-size:10px; display:flex; justify-content:space-between; flex-shrink:0; }

  /* ── History Sidebar ── */
  .sidebar { position:fixed; top:0; left:0; bottom:0; width:280px; background:var(--bg2); border-right:1px solid var(--border); z-index:90; transform:translateX(-100%); transition:transform .2s ease; display:flex; flex-direction:column; }
  .sidebar.open { transform:translateX(0); }
  .sidebar-hdr { padding:10px 14px; border-bottom:1px solid var(--border); display:flex; justify-content:space-between; align-items:center; flex-shrink:0; }
  .sidebar-title { color:var(--accent); font-weight:700; font-size:11px; letter-spacing:1px; }
  .sidebar-close { background:none; border:none; color:var(--dim); font-size:16px; cursor:pointer; padding:0 4px; font-family:inherit; }
  .sidebar-close:hover { color:var(--text); }
  .sidebar-body { flex:1; overflow-y:auto; }
  .sidebar-body::-webkit-scrollbar { width:4px; }
  .sidebar-body::-webkit-scrollbar-track { background:var(--bg2); }
  .sidebar-body::-webkit-scrollbar-thumb { background:var(--border); border-radius:2px; }
  .sidebar-empty { color:var(--dim); font-size:11px; text-align:center; padding:30px 14px; line-height:1.8; }
  .sidebar-item { padding:8px 14px; border-bottom:1px solid #181818; cursor:pointer; transition:background .12s; }
  .sidebar-item:hover { background:var(--bg3); }
  .sidebar-item-q { color:var(--bright); font-size:11px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; margin-bottom:3px; }
  .sidebar-item-meta { color:var(--dim); font-size:9.5px; display:flex; gap:8px; }
  .sidebar-item-meta .accent { color:var(--accent); }
  .sidebar-footer { padding:8px 14px; border-top:1px solid var(--border); flex-shrink:0; }
  .sidebar-clear { width:100%; background:none; border:1px solid var(--border); color:var(--dim); padding:5px; border-radius:3px; font-family:inherit; font-size:10px; cursor:pointer; letter-spacing:1px; }
  .sidebar-clear:hover { border-color:var(--dim); color:var(--text); }
  .sidebar-tab { position:fixed; left:0; top:50%; transform:translateY(-50%); z-index:89; background:var(--bg3); border:1px solid var(--accent); border-left:2px solid var(--accent); border-radius:0 5px 5px 0; padding:12px 6px; cursor:pointer; color:var(--accent); font-size:10px; writing-mode:vertical-rl; text-orientation:upright; letter-spacing:1.5px; font-family:inherit; font-weight:700; box-shadow:0 0 8px rgba(0,255,159,.1); }
  .sidebar-tab:hover { background:var(--bg2); box-shadow:0 0 14px rgba(0,255,159,.2); }
  .sidebar-overlay { position:fixed; inset:0; background:rgba(0,0,0,.4); z-index:88; }

  /* ── Batch Mode ── */
  .mode-toggle { display:flex; border:1px solid var(--border); border-radius:3px; overflow:hidden; flex-shrink:0; }
  .mode-btn { background:none; border:none; padding:6px 12px; color:var(--dim); font-family:inherit; font-size:10px; font-weight:700; letter-spacing:1px; cursor:pointer; transition:all .15s; }
  .mode-btn:hover { color:var(--text); }
  .mode-btn.active { background:var(--accent); color:var(--bg); }
  .batch-textarea { flex:1; background:var(--bg); border:1px solid var(--border); border-radius:3px; padding:7px 10px; color:var(--accent); font-family:inherit; font-size:12px; outline:none; resize:vertical; min-height:34px; max-height:200px; line-height:1.5; }
  .batch-textarea:focus { border-color:var(--accent); }
  .batch-textarea::placeholder { color:var(--dim); }
  .batch-info { color:var(--dim); font-size:10px; white-space:nowrap; flex-shrink:0; letter-spacing:0.5px; }
  .batch-progress { margin:0 8px 0 0; padding:4px 10px; background:var(--bg3); border:1px solid var(--border); border-radius:3px; color:var(--text); font-size:10px; font-family:inherit; flex-shrink:0; }
  .batch-progress .cur { color:var(--accent); font-weight:700; }

  /* Batch results grouped */
  .batch-group { border-bottom:1px solid var(--border); }
  .batch-group-hdr { padding:8px 12px; background:var(--bg2); border-bottom:1px solid var(--border); cursor:pointer; display:flex; align-items:center; gap:8px; transition:background .12s; }
  .batch-group-hdr:hover { background:var(--bg3); }
  .batch-group-arrow { color:var(--accent); font-size:10px; transition:transform .15s; flex-shrink:0; }
  .batch-group-arrow.open { transform:rotate(90deg); }
  .batch-group-query { color:var(--bright); font-size:11.5px; flex:1; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .batch-group-meta { display:flex; gap:10px; flex-shrink:0; }
  .batch-group-meta span { font-size:10px; color:var(--dim); }
  .batch-group-meta .count { color:var(--accent); }
  .batch-group-meta .time { color:var(--dim); }
  .batch-group-meta .err { color:var(--err); }
  .batch-group-body { display:none; }
  .batch-group-body.open { display:block; }
  .batch-load-examples { background:none; border:1px solid var(--border); color:var(--dim); padding:6px 10px; border-radius:3px; font-family:inherit; font-size:10px; cursor:pointer; letter-spacing:0.5px; flex-shrink:0; }
  .batch-load-examples:hover { border-color:var(--dim); color:var(--text); }
</style>

/* ── Match Tree Renderer ── */
function renderTree(node, depth=0) {
  const pad = '      ' + '  '.repeat(depth);
  if (node.type === 'leaf') return `${pad}"${node.value}"`;
  const op = node.operator;
  const children = (node.operands||[]);
  // compact if all leaves
  if (children.every(c => c.type === 'leaf')) {
    const vals = children.map(c => c.value);
    if (vals.length <= 4) return `${pad}${op}(${vals.join(', ')})`;
    return `${pad}${op}(${vals.slice(0,4).join(', ')}... +${vals.length-4} more)`;
  }
  let lines = [`${pad}${op}(`];
  for (const c of children) lines.push(renderTree(c, depth+1));
  lines.push(`${pad})`);
  return lines.join('\n');
}

/* ── Compiled Query Component ── */
function CompiledQuery({ data }) {
  if (!data) return null;
  const { original_query, complexity, confidence, hard_filters, semantic, match_trees } = data;
  return (
    <div className="cq">
      <div className="cq-top">COMPILED QUERY</div>
      <div className="cq-row"><span className="t-dim">Original: </span><span className="t-val">"{original_query}"</span></div>
      <div className="cq-row"><span className="t-dim">Complexity: </span><span className="t-val">{complexity}</span><span className="t-dim">  |  Confidence: </span><span className="t-val">{confidence}</span></div>

      <div className="cq-section">Hard Filters (Stage 1)</div>
      {hard_filters.length === 0
        ? <div className="cq-row cq-none">  (none — all companies pass)</div>
        : hard_filters.map((f,i) => (
            <div key={i} className="cq-row cq-filter">
              {'  '}{f.field} {f.op} {Array.isArray(f.value) ? `[${f.value.join(', ')}]` : String(f.value)}
            </div>
          ))
      }

      {data.naics_was_relaxed && (
        <div className="cq-row" style={{color:'var(--warn)', padding:'4px 10px', background:'#1a1500', borderTop:'1px solid #332200'}}>
          ⚠ NAICS industry filter was relaxed (moved to soft scoring — candidates may not match industry)
        </div>
      )}

      <div className="cq-section">Semantic Criteria (Stage 2)</div>
      {Object.keys(semantic).length === 0 && match_trees.length === 0
        ? <div className="cq-row cq-none">  (none)</div>
        : <>
            {Object.entries(semantic).map(([k, v]) => (
              <div key={k} className="cq-row cq-kw">{'  '}{k}: [{(Array.isArray(v) ? v : [v]).slice(0,6).join(', ')}{v.length > 6 ? `... +${v.length-6} more` : ''}]</div>
            ))}
            {match_trees.length > 0 && <>
              <div className="cq-row t-dim" style={{marginTop:4}}>{'  '}Match expression tree:</div>
              {match_trees.map((tree,i) => (
                <div key={i} className="cq-row cq-tree" style={{whiteSpace:'pre'}}>{renderTree(tree)}</div>
              ))}
            </>}
          </>
      }
    </div>
  );
}

/* ── Pipeline Trace Component ── */
function PipelineTrace({ steps }) {
  if (!steps || steps.length === 0) return null;
  return (
    <div style={{margin:'4px 0'}}>
      <div className="t t-dim">  {'─'.repeat(48)}</div>
      <div className="t t-dim">  Pipeline trace:</div>
      <div className="t t-dim">  {'─'.repeat(48)}</div>
      {steps.map((s,i) => (
        <div key={i} className="t t-info">
          {'  '}[{(s.stage+'            ').slice(0,12)}] {s.action}{s.detail ? `: ${s.detail}` : ''}
        </div>
      ))}
      <div className="t t-dim">  {'─'.repeat(48)}</div>
    </div>
  );
}

    setNoData(null);
    setLastTime(DEMO_DATA.elapsed);
    setQCount(p => p+1);
    setBannerDismissed(true);
  }, [buildLogEntries]);

  const saveToHistory = useCallback((queryText, data) => {
    const rl = data.results || [];
    const scores = rl.map(r => r.score);
    const entry = {
      id: Date.now(),
      query: queryText,
      timestamp: new Date().toISOString(),
      resultCount: rl.length,
      elapsed: data.elapsed,
      avgScore: rl.length > 0 ? +(scores.reduce((a,b)=>a+b,0)/scores.length).toFixed(3) : 0,
      data: { compiled: data.compiled, pipeline_trace: data.pipeline_trace, stages: data.stages, results: data.results, elapsed: data.elapsed, no_data: data.no_data, no_data_message: data.no_data_message, warning: data.warning, note: data.note }
    };
    setHistory(prev => {
      const next = [entry, ...prev].slice(0, 20);
      try { localStorage.setItem('cq_history', JSON.stringify(next)); } catch {}
      return next;
    });
  }, []);

  const restoreFromHistory = useCallback((entry) => {
    const entries = buildLogEntries(entry.data, entry.query);
    setLogEntries(entries);
    setResults(entry.data.results || []);
    setNoData(entry.data.no_data ? (entry.data.no_data_message || 'Dataset does not contain companies matching this query.') : null);
    setLastTime(entry.data.elapsed);
    setSidebarOpen(false);
  }, [buildLogEntries]);

  const clearHistory = useCallback(() => {
    setHistory([]);
    try { localStorage.removeItem('cq_history'); } catch {}
  }, []);

  const runQuery = useCallback(async () => {
    if (!query.trim() || loading) return;
    const q = query.trim();
    setQuery('');
    setLoading(true);
    setResults([]);
    setNoData(null);
    setQCount(p => p+1);

    // Show a "running" indicator while waiting
    addLog('t-sep', '\u2501'.repeat(55));
    addLog('t-hdr', `  \u25b8 Query: "${q}"`);
    addLog('t-dim', `    Waiting for response...`);

    try {
      const resp = await fetch(`/api/query?q=${encodeURIComponent(q)}`);
      const data = await resp.json();

      // Replace log with full output from buildLogEntries
      const entries = buildLogEntries(data, q);
      setLogEntries(entries);

      const rl = data.results || [];
      setResults(rl);
      setNoData(data.no_data ? (data.no_data_message || 'Dataset does not contain companies matching this query.') : null);
      setLastTime(data.elapsed);
      saveToHistory(q, data);
    } catch (e) {
      addLog('t-err', `  \u2717 Request failed: ${e.message}`);
    } finally {
      setLoading(false);
      inputRef.current?.focus();
    }
  }, [query, loading, status, addLog, buildLogEntries, saveToHistory]);

  const batchQueries = batchText.split('\n').map(l => l.trim()).filter(Boolean);

  const runBatch = useCallback(async () => {
    if (batchQueries.length === 0 || loading) return;
    setLoading(true);
    setBatchResults([]);
    setBatchProgress({ current: 0, total: batchQueries.length });
    setExpandedGroups({});
    setResults([]);
    setNoData(null);
    setLogEntries([]);

    addLog('t-sep', '\u2501'.repeat(55));
    addLog('t-hdr', `  \u25b8 BATCH MODE: ${batchQueries.length} queries`);
    addLog('t-dim', `    Processing sequentially...`);

    try {
      const resp = await fetch('/api/batch', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ queries: batchQueries }),
      });
      const data = await resp.json();

      if (data.error) {
        addLog('t-err', `  \u2717 ${data.error}`);
        setLoading(false);
        setBatchProgress(null);
        return;
      }

      const batchRes = (data.results || []).map((r, i) => ({
        query: r.query || batchQueries[i],
        data: r,
        error: r.error || null,
      }));

      setBatchResults(batchRes);
      setBatchProgress(null);
      setQCount(p => p + batchQueries.length);

      // Build combined log
      const allEntries = [];
      allEntries.push({ cls: 't-sep', content: '\u2501'.repeat(55), id: Date.now() });
      allEntries.push({ cls: 't-hdr', content: `  \u25b8 BATCH COMPLETE: ${batchQueries.length} queries in ${data.total_elapsed}s`, id: Date.now()+1 });
      allEntries.push({ cls: '', content: '', id: Date.now()+2 });

      batchRes.forEach((br, idx) => {
        if (br.error && !br.data?.stages) {
          allEntries.push({ cls: 't-err', content: `  [${idx+1}/${batchRes.length}] "${br.query}" \u2014 ERROR: ${br.error}`, id: Date.now()+idx*100+10 });
        } else {
          const entries = buildLogEntries(br.data, br.query);
          entries.forEach(e => { e.id = Date.now()+idx*100+Math.random(); });
          // Add query index label
          allEntries.push({ cls: 't-ok', content: `  \u250c\u2500 QUERY ${idx+1}/${batchRes.length} ${'─'.repeat(40)}`, id: Date.now()+idx*100+3 });
          allEntries.push(...entries);
        }
      });

      allEntries.push({ cls: '', content: '', id: Date.now()+9990 });
      allEntries.push({ cls: 't-ok', content: `  \u2550\u2550\u2550 BATCH DONE: ${batchRes.length} queries \u2502 ${data.total_elapsed}s total \u2550\u2550\u2550`, id: Date.now()+9991 });
      setLogEntries(allEntries);
      setLastTime(data.total_elapsed);

      // Auto-expand first group
      setExpandedGroups({ 0: true });

      // Save each to history
      batchRes.forEach(br => {
        if (!br.error || br.data?.stages) saveToHistory(br.query, br.data);
      });

    } catch (e) {
      addLog('t-err', `  \u2717 Batch request failed: ${e.message}`);
      setBatchProgress(null);
    } finally {
      setLoading(false);
    }
  }, [batchQueries, loading, addLog, buildLogEntries, saveToHistory]);

  const loadExamples = useCallback(() => {
    setBatchText(EXAMPLE_QUERIES.join('\n'));
  }, []);

  const toggleGroup = useCallback((idx) => {
    setExpandedGroups(prev => ({ ...prev, [idx]: !prev[idx] }));
  }, []);

  return (<>
    {/* Header */}
    <div className="hdr">
      <div className="hdr-title">{'>'} COMPANY QUALIFIER_</div>
      <div className="hdr-right">
        <span className="hdr-stat">{status ? <>{status.companies} companies{status.llm_available ? <> | <span className="on">LLM: {status.llm_model}</span></> : <> | <span className="off">LLM: OFF</span></>}</> : '...'}</span>
        {qCount > 0 && <span className="hdr-stat">Queries: {qCount}</span>}
      </div>
    </div>

    {/* Warning banner */}
    {showBanner && (
      <div className="banner">
        <div className="banner-body">
          <div className="banner-title">No OpenAI API Key Detected</div>
          <div className="banner-text">Set the <code>OPENAI_API_KEY</code> environment variable and restart the server to enable queries.</div>
        </div>
        <div className="banner-actions">
          <button className="banner-btn banner-btn-demo" onClick={loadDemo}>TRY DEMO</button>
          <button className="banner-btn banner-btn-dismiss" onClick={()=>setBannerDismissed(true)}>DISMISS</button>
        </div>
      </div>
    )}

    {/* Query bar */}
    <div className="qbar">
      <div className="mode-toggle">
        <button className={`mode-btn ${!batchMode?'active':''}`} onClick={()=>setBatchMode(false)}>SINGLE</button>
        <button className={`mode-btn ${batchMode?'active':''}`} onClick={()=>setBatchMode(true)}>BATCH</button>
      </div>
      {!batchMode ? (<>
        <span className="qbar-prompt">$</span>
        <input ref={inputRef} className="qbar-input" type="text" value={query} onChange={e=>setQuery(e.target.value)} onKeyDown={e=>{if(e.key==='Enter')runQuery()}} placeholder={noKey ? 'API key required — set OPENAI_API_KEY to enable queries' : 'Enter query... e.g. "Logistics companies in Germany"'} disabled={loading || noKey} autoFocus />
        <button className="qbar-btn" onClick={runQuery} disabled={loading||!query.trim()||noKey}>
          {loading ? <><span className="spinner"/>RUNNING</> : 'RUN'}
        </button>
      </>) : (<>
        <textarea className="batch-textarea" rows={Math.min(6, Math.max(2, batchQueries.length+1))} value={batchText} onChange={e=>setBatchText(e.target.value)} placeholder={"One query per line:\nPublic software companies with more than 1,000 employees\nPharmaceutical companies in Switzerland\n..."} disabled={loading || noKey} />
        <div style={{display:'flex',flexDirection:'column',gap:'4px',alignItems:'stretch'}}>
          <button className="qbar-btn" onClick={runBatch} disabled={loading||batchQueries.length===0||noKey}>
            {loading ? <><span className="spinner"/>RUNNING {batchProgress ? `${batchProgress.current}/${batchProgress.total}` : ''}</> : `QUALIFY ALL`}
          </button>
          <button className="batch-load-examples" onClick={loadExamples} disabled={loading}>LOAD 12 EXAMPLES</button>
        </div>
        {batchQueries.length > 0 && <span className="batch-info">{batchQueries.length} {batchQueries.length===1?'query':'queries'}</span>}
      </>)}
      <button className="qbar-clear" onClick={()=>{clearLog();setBatchResults([]);setBatchProgress(null);}} title="Clear log">CLEAR</button>
    </div>

    {/* Main */}
    <div className="main">
      {/* Pipeline log */}
      <div className="panel">
        <div className="panel-hdr">
          <span>Pipeline Log</span>
          <span style={{color:'var(--dim)',fontSize:'9px'}}>{logEntries.filter(e=>!e.component).length} lines</span>
        </div>
        <div className="panel-body">
          {logEntries.length === 0 ? (
            <div className="empty">Pipeline log will appear here.<br/>Enter a query to begin.</div>
          ) : (
            <div className="term">
              {logEntries.map(e =>
                e.component
                  ? <div key={e.id}>{e.component}</div>
                  : <div key={e.id} className={`t ${e.cls||''}`}>{e.content}</div>
              )}
              <div ref={logEnd} />
            </div>
          )}
        </div>
      </div>

      {/* Results */}
      <div className="panel">
        <div className="panel-hdr">
          <span>Results {batchMode && batchResults.length > 0 ? `(${batchResults.length} queries)` : results.length > 0 ? `(${results.length})` : ''}</span>
          {batchMode && batchResults.length > 0 && (
            <span style={{fontSize:'9px',color:'var(--dim)'}}>
              {batchResults.reduce((s,br) => s + (br.data?.results?.length||0), 0)} total companies
            </span>
          )}
        </div>
        <div className="panel-body">
          {batchMode && batchResults.length > 0 ? (
            /* Batch grouped results */
            <div>
              {batchResults.map((br, idx) => {
                const rl = br.data?.results || [];
                const isOpen = !!expandedGroups[idx];
                return (
                  <div key={idx} className="batch-group">
                    <div className="batch-group-hdr" onClick={()=>toggleGroup(idx)}>
                      <span className={`batch-group-arrow ${isOpen?'open':''}`}>▶</span>
                      <span className="batch-group-query">{idx+1}. {br.query}</span>
                      <div className="batch-group-meta">
                        {br.error && !br.data?.stages ? (
                          <span className="err">ERROR</span>
                        ) : (<>
                          <span className="count">{rl.length} results</span>
                          {br.data?.elapsed && <span className="time">{br.data.elapsed}s</span>}
                        </>)}
                      </div>
                    </div>
                    <div className={`batch-group-body ${isOpen?'open':''}`}>
                      {br.error && !br.data?.stages ? (
                        <div style={{padding:'10px 12px',color:'var(--err)',fontSize:'11px'}}>{br.error}</div>
                      ) : rl.length === 0 ? (
                        <div style={{padding:'10px 12px',color:'var(--dim)',fontSize:'11px'}}>
                          {br.data?.no_data ? (br.data.no_data_message || 'No matching companies.') : 'No results.'}
                        </div>
                      ) : (
                        <table className="rtbl"><thead><tr><th>#</th><th>Score</th><th>Company</th><th>Stage</th><th>Location</th></tr></thead><tbody>
                          {rl.map((r,i) => (
                            <tr key={i} onClick={()=>setSelected(r)}>
                              <td style={{color:'var(--dim)'}}>{i+1}</td>
                              <td className={sc(r.score)}>{r.score.toFixed(3)}</td>
                              <td className="cname">{r.name}</td>
                              <td><span className={`stag stag-${r.stage}`}>{r.stage}</span></td>
                              <td className="loc">{r.address||'—'}</td>
                            </tr>
                          ))}
                        </tbody></table>
                      )}
                    </div>
                  </div>
                );
              })}
            </div>
          ) : noData ? (
            <div className="empty" style={{color:'var(--err)', flexDirection:'column'}}>
              <div style={{fontSize:'18px',marginBottom:'12px'}}>✗ NO MATCHING DATA</div>
              <div style={{color:'var(--dim)',fontSize:'11px',maxWidth:'340px',lineHeight:'1.6',textAlign:'center'}}>{noData}</div>
            </div>
          ) : results.length === 0 ? (
            <div className="empty">{loading ? <><span className="spinner"/>Processing...</> : <>Results will appear here.<br/>Click a row for details.</>}</div>
          ) : (
            <table className="rtbl"><thead><tr><th>#</th><th>Score</th><th>Company</th><th>Stage</th><th>Location</th></tr></thead><tbody>
              {results.map((r,i) => (
                <tr key={i} onClick={()=>setSelected(r)}>
                  <td style={{color:'var(--dim)'}}>{i+1}</td>
                  <td className={sc(r.score)}>{r.score.toFixed(3)}</td>
                  <td className="cname">{r.name}</td>
                  <td><span className={`stag stag-${r.stage}`}>{r.stage}</span></td>
                  <td className="loc">{r.address||'—'}</td>
                </tr>
              ))}
            </tbody></table>
          )}
        </div>
      </div>
    </div>

    {/* Footer */}
    <div className="footer">
      <span>Company Qualifier v1.0 — Multi-Stage Pipeline</span>
      <span>{lastTime!=null && `Last: ${lastTime}s`}{status?.llm_available ? `  │  Model: ${status.llm_model}` : ''}</span>
    </div>

    {/* History Sidebar */}
    {!sidebarOpen && (
      <div className="sidebar-tab" onClick={()=>setSidebarOpen(true)}>
        HISTORY {history.length > 0 && `${history.length}`}
      </div>
    )}
    {sidebarOpen && <div className="sidebar-overlay" onClick={()=>setSidebarOpen(false)} />}
    <div className={`sidebar ${sidebarOpen ? 'open' : ''}`}>
      <div className="sidebar-hdr">
        <span className="sidebar-title">QUERY HISTORY</span>
        <button className="sidebar-close" onClick={()=>setSidebarOpen(false)}>&times;</button>
      </div>
      <div className="sidebar-body">
        {history.length === 0 ? (
          <div className="sidebar-empty">No queries yet.<br/>Run a query to populate history.</div>
        ) : history.map(h => (
          <div key={h.id} className="sidebar-item" onClick={()=>restoreFromHistory(h)}>
            <div className="sidebar-item-q">{h.query}</div>
            <div className="sidebar-item-meta">
              <span>{new Date(h.timestamp).toLocaleTimeString()}</span>
              <span className="accent">{h.resultCount} results</span>
              <span>{h.elapsed}s</span>
              {h.avgScore > 0 && <span>avg: {h.avgScore}</span>}
            </div>
          </div>
        ))}
      </div>
      {history.length > 0 && (
        <div className="sidebar-footer">
          <button className="sidebar-clear" onClick={clearHistory}>CLEAR HISTORY</button>
        </div>
      )}
    </div>

    {selected && <DetailModal c={selected} onClose={()=>setSelected(null)} />}
  </>);
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
